[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-tcx-ai"
version = "0.2.0"
description = "Personal Garmin TCX ETL and analysis scaffold."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Jia-Long Chen" }
]
license = "MIT"
dependencies = [
    "streamlit>=1.56",
]


[project.optional-dependencies]
garminconnect = [
    "garminconnect",
    "curl_cffi",
    "keyring",
]

[project.scripts]
garmin-tcx-ai = "garmin_tcx_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
# Keep the classic default rule set; newer ruff releases widened the
# default selection and would flag unrelated pre-existing code.
select = ["E4", "E7", "E9", "F"]
